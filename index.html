<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARENA FUT PRO</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #d4ff00; --bg: #121212; --card: #1e1e1e;
            --text: #ffffff; --accent: #2c2c2c; --danger: #ff4444;
        }
        body {
            font-family: sans-serif; background-color: var(--bg); color: var(--text);
            margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        .screen { display: none; width: 100%; max-width: 500px; padding: 20px; box-sizing: border-box; }
        .active { display: block; }
        h1, h2 { color: var(--primary); text-transform: uppercase; text-align: center; }
        .card { background: var(--card); padding: 20px; border-radius: 15px; margin-bottom: 15px; }
        input, select, button {
            width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px;
            border: none; box-sizing: border-box; font-size: 1rem;
        }
        input, select { background: var(--accent); color: white; }
        button { background-color: var(--primary); color: black; font-weight: bold; cursor: pointer; }
        #cronometro { font-size: 4rem; text-align: center; font-weight: 900; color: var(--primary); font-family: monospace; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .placar-numero { font-size: 3.5rem; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <div id="tela-login" class="screen active">
        <h1 style="margin-top: 50px;">ARENA FUT PRO</h1>
        <div class="card">
            <button id="btn-login" onclick="loginGoogle()">Entrar com Google</button>
            <p id="msg-erro" style="color:red; text-align:center; font-size:0.8rem;"></p>
        </div>
    </div>

    <div id="tela-perfil" class="screen">
        <h2>Perfil Técnico</h2>
        <div class="card">
            <input type="number" id="perf-altura" placeholder="Altura (cm)">
            <input type="number" id="perf-peso" placeholder="Peso (kg)">
            <select id="perf-pe">
                <option value="">Pé Preferido</option>
                <option value="Destro">Destro</option>
                <option value="Canhoto">Canhoto</option>
            </select>
            <select id="perf-posicao">
                <option value="">Posição</option>
                <option value="Goleiro">Goleiro</option>
                <option value="Fixo">Fixo</option>
                <option value="Ala">Ala</option>
                <option value="Pivo">Pivô</option>
            </select>
            <button onclick="salvarPerfil()">Concluir</button>
        </div>
    </div>

    <div id="tela-dashboard" class="screen">
        <h2>Nova Partida</h2>
        <div class="card">
            <input type="text" id="game-nome" placeholder="Nome do Evento">
            <div class="grid-2">
                <input type="number" id="game-jogadores" placeholder="Jogadores/Time" value="5">
                <input type="number" id="game-tempo" placeholder="Minutos" value="10">
            </div>
            <button onclick="iniciarJogo()">Abrir Cronômetro</button>
        </div>
        <button onclick="logout()" style="background:none; color:var(--danger);">Sair</button>
    </div>

    <div id="tela-jogo" class="screen">
        <h2 id="live-nome-evento">Partida</h2>
        <div id="cronometro">00:00</div>
        <div class="grid-2">
            <button onclick="toggleCronometro()" id="btn-cron">INICIAR</button>
            <button onclick="resetCronometro()" style="background:#444; color:white;">RESET</button>
        </div>
        <div class="grid-2" style="margin-top:20px;">
            <div class="card">
                <div id="placar-a" class="placar-numero">0</div>
                <button onclick="marcarGol('A')">GOL A</button>
            </div>
            <div class="card">
                <div id="placar-b" class="placar-numero">0</div>
                <button onclick="marcarGol('B')">GOL B</button>
            </div>
        </div>
        <button onclick="irPara('tela-dashboard')" style="background:#333; color:white;">Voltar</button>
    </div>

    <script>
        // === ATENÇÃO: COLE SUAS CHAVES REAIS AQUI ===
        const firebaseConfig = {
            apiKey: "SUA_API_KEY_AQUI",
            authDomain: "SEU_PROJETO.firebaseapp.com",
            projectId: "SEU_PROJETO",
            storageBucket: "SEU_PROJETO.appspot.com",
            messagingSenderId: "SEU_ID",
            appId: "SEU_APP_ID"
        };
        // ===========================================

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        function irPara(telaId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(telaId).classList.add('active');
        }

        async function verificarUsuario(user) {
            try {
                const doc = await db.collection("usuarios").doc(user.uid).get();
                if (doc.exists) {
                    irPara("tela-dashboard");
                } else {
                    irPara("tela-perfil");
                }
            } catch (e) {
                console.error("Erro ao ler banco:", e);
                irPara("tela-perfil"); 
            }
        }

        function loginGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).then(res => {
                verificarUsuario(res.user);
            }).catch(err => {
                document.getElementById('msg-erro').innerText = "Erro: " + err.message;
                console.error(err);
            });
        }

        async function salvarPerfil() {
            const user = auth.currentUser;
            const dados = {
                nome: user.displayName,
                altura: document.getElementById('perf-altura').value,
                pe: document.getElementById('perf-pe').value,
                posicao: document.getElementById('perf-posicao').value
            };
            await db.collection("usuarios").doc(user.uid).set(dados);
            irPara("tela-dashboard");
        }

        function logout() { auth.signOut().then(() => location.reload()); }

        // Lógica simples de cronômetro
        let tempoRestante, cronInterval;
        function iniciarJogo() {
            tempoRestante = document.getElementById('game-tempo').value * 60;
            document.getElementById('live-nome-evento').innerText = document.getElementById('game-nome').value;
            atualizarCron();
            irPara("tela-jogo");
        }
        function atualizarCron() {
            const m = Math.floor(tempoRestante / 60);
            const s = tempoRestante % 60;
            document.getElementById('cronometro').innerText = `${m}:${s < 10 ? '0'+s : s}`;
        }
        function toggleCronometro() {
            if (cronInterval) { clearInterval(cronInterval); cronInterval = null; }
            else {
                cronInterval = setInterval(() => {
                    if (tempoRestante > 0) { tempoRestante--; atualizarCron(); }
                    else { clearInterval(cronInterval); alert("Fim!"); }
                }, 1000);
            }
        }
        function resetCronometro() { 
            clearInterval(cronInterval); cronInterval = null; 
            tempoRestante = document.getElementById('game-tempo').value * 60; 
            atualizarCron(); 
        }
        let ga = 0, gb = 0;
        function marcarGol(t) {
            if(t==='A') { ga++; document.getElementById('placar-a').innerText = ga; }
            else { gb++; document.getElementById('placar-b').innerText = gb; }
        }

        // Checar se já está logado ao abrir
        auth.onAuthStateChanged(user => { if (user) verificarUsuario(user); });
    </script>
</body>
</html>

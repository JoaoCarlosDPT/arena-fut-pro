<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARENA FUT PRO</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #d4ff00; --bg: #121212; --card: #1e1e1e; --text: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: var(--card); border-radius: 15px; padding: 25px; border-bottom: 4px solid var(--primary); width: 100%; max-width: 400px; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        h1 { color: var(--primary); font-style: italic; margin-bottom: 5px; }
        button { width: 100%; padding: 15px; background: var(--primary); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; color: #000; margin-top: 10px; font-size: 1rem; transition: 0.2s; }
        button:active { transform: scale(0.98); }
        input { width: calc(100% - 22px); padding: 12px; margin-bottom: 10px; border-radius: 8px; border: none; background: #2c2c2c; color: #fff; }
        #chat-box { height: 200px; overflow-y: auto; background: #000; padding: 15px; text-align: left; border-radius: 8px; border: 1px solid #333; margin-bottom: 10px; font-size: 0.9rem; }
        .msg { margin-bottom: 8px; border-bottom: 1px solid #222; padding-bottom: 4px; }
        .msg b { color: var(--primary); }
    </style>
</head>
<body>

    <h1>ARENA FUT PRO</h1>
    <p style="color: #888; margin-top: -10px; margin-bottom: 30px;">Gestão Profissional de Peladas</p>
    
    <div id="login-area" class="card">
        <button onclick="fazerLogin()">Entrar com Google</button>
        <p id="msg-erro" style="color: #ff4444; font-size: 0.8rem; margin-top: 10px;"></p>
    </div>

    <div id="app-area" style="display:none; width: 100%; max-width: 400px;">
        <div class="card">
            <p>Fala, <b id="nome-user" style="color: var(--primary);"></b>!</p>
            <button onclick="criarPartida()">Nova Partida (Admin)</button>
        </div>

        <div class="card">
            <h3>Chat da Arena</h3>
            <div id="chat-box"></div>
            <input type="text" id="msg-input" placeholder="Diz aí, craque...">
            <button onclick="enviarMsg()">Enviar</button>
        </div>
        
        <button onclick="firebase.auth().signOut()" style="background:transparent; color:#888; border: 1px solid #333;">Sair da Conta</button>
    </div>

    <script>
        // CONFIGURAÇÃO OFICIAL DO SEU FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDyB1Rzcm_9TPYFHzlbJUMWIN9NupkXjG0",
            authDomain: "arena-fut-42a7d.firebaseapp.com",
            databaseURL: "https://arena-fut-42a7d-default-rtdb.firebaseio.com",
            projectId: "arena-fut-42a7d",
            storageBucket: "arena-fut-42a7d.firebasestorage.app",
            messagingSenderId: "843798970197",
            appId: "1:843798970197:web:222e052ef828065e5f39dc"
        };

        // Inicializar
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const rtdb = firebase.database();

        function fazerLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(err => {
                document.getElementById('msg-erro').innerText = "Erro: " + err.message;
            });
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('login-area').style.display = 'none';
                document.getElementById('app-area').style.display = 'block';
                document.getElementById('nome-user').innerText = user.displayName;
                
                // Grava usuário no Firestore (Regra: /usuarios/{userId})
                db.collection("usuarios").doc(user.uid).set({
                    nome: user.displayName,
                    email: user.email,
                    foto: user.photoURL,
                    ultima_conexao: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                ouvirChat();
            } else {
                document.getElementById('login-area').style.display = 'block';
                document.getElementById('app-area').style.display = 'none';
            }
        });

        // Criar Partida (Regra: admin_uid == auth.uid)
        function criarPartida() {
            db.collection("partidas").add({
                nome: "Pelada " + new Date().toLocaleDateString(),
                admin_uid: auth.currentUser.uid, 
                status: "aberta",
                criado_em: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => alert("Partida criada no Banco de Dados!"));
        }

        // Sistema de Chat (Realtime Database)
        function enviarMsg() {
            const input = document.getElementById('msg-input');
            const texto = input.value;
            if(texto.trim() !== "") {
                rtdb.ref('chats/geral').push({
                    usuario: auth.currentUser.displayName,
                    texto: texto,
                    hora: new Date().toLocaleTimeString()
                });
                input.value = '';
            }
        }

        function ouvirChat() {
            rtdb.ref('chats/geral').limitToLast(15).on('value', snap => {
                const box = document.getElementById('chat-box');
                box.innerHTML = '';
                snap.forEach(child => {
                    const d = child.val();
                    box.innerHTML += `<div class="msg"><b>${d.usuario}:</b> ${d.texto}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena Fut PRO - Master</title>
    <style>
        :root { --neon: #00ff88; --dark: #000; --card: #1a1a1a; --border: #333; --blue: #007bff; --red: #dc3545; --gold: #ffcc00; }
        body { background: var(--dark); color: #fff; font-family: 'Segoe UI', sans-serif; padding: 10px; margin: 0; padding-bottom: 80px; min-height: 100vh; }
        button { border-radius: 12px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .btn-neon { background: var(--neon); color: #000; padding: 15px; width: 100%; margin-top: 10px; }
        .card { background: var(--card); padding: 15px; border-radius: 16px; margin-bottom: 12px; border: 1px solid var(--border); }
        .placar-box { font-size: 55px; font-weight: 900; text-align: center; display: flex; justify-content: center; align-items: center; gap: 20px; }
        .tab-container { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab { flex: 1; padding: 10px; text-align: center; background: #222; border-radius: 8px; font-size: 11px; cursor: pointer; color: #888; }
        .tab.active { background: var(--neon); color: #000; font-weight: bold; }
        #cronometro { font-size: 40px; text-align: center; color: var(--gold); font-weight: 900; }
        .user-info { display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-bottom: 10px; color: #aaa; }
        .btn-logout { background: transparent; color: #ff4444; border: 1px solid #ff4444; padding: 5px 10px; font-size: 10px; border-radius: 5px; }
        .ranking-item { display: grid; grid-template-columns: 30px 1fr 50px; padding: 12px; border-bottom: 1px solid #222; font-size: 14px; align-items: center; }
        .btn-finish { background: transparent; color: var(--gold); border: 1px solid var(--gold); width: 100%; padding: 10px; margin-top: 20px; font-size: 11px; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, updateDoc, getDoc, setDoc, increment, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyDy0lRzcm_9TPYFHz1bJUMwIW9NupkXjG0", 
            authDomain: "arena-fut-42a7d.firebaseapp.com", 
            projectId: "arena-fut-42a7d" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let SALA_ID = "aLNOO6Ds6fEBmrj6P7he"; 
        let tempoSegundos = 600;
        let interval = null;

        window.login = () => signInWithPopup(auth, provider);
        window.logout = () => signOut(auth).then(() => location.reload());

        async function obterReferenciaSala() {
            let ref = doc(db, "salas", SALA_ID);
            let snap = await getDoc(ref);
            if (snap.exists()) return ref;
            const querySnapshot = await getDocs(collection(db, "salas"));
            if (!querySnapshot.empty) {
                SALA_ID = querySnapshot.docs[0].id;
                return doc(db, "salas", SALA_ID);
            }
            return null;
        }

        window.registrarGol = async (timeIdx, nome) => {
            try {
                const salaRef = await obterReferenciaSala();
                const salaSnap = await getDoc(salaRef);
                let dados = salaSnap.data();
                let novoPlacar = dados.placar ? [...dados.placar] : [0, 0];
                novoPlacar[timeIdx] = Number(novoPlacar[timeIdx]) + 1;
                await updateDoc(salaRef, { placar: novoPlacar });

                const userRef = doc(db, "usuarios", nome);
                const userSnap = await getDoc(userRef);
                if (userSnap.exists()) {
                    await updateDoc(userRef, { gols: increment(1) });
                } else {
                    await setDoc(userRef, { gols: 1, vitorias: 0 });
                }
            } catch (error) {
                alert("Erro ao marcar gol: " + error.message);
            }
        };

        window.finalizarPartida = async () => {
            if(!confirm("Deseja finalizar a partida e zerar o placar?")) return;
            try {
                const salaRef = await obterReferenciaSala();
                const salaSnap = await getDoc(salaRef);
                const placarFinal = salaSnap.data().placar;
                
                alert(`Partida Finalizada!\nResultado: Azul ${placarFinal[0]} x ${placarFinal[1]} Vermelho`);
                
                await updateDoc(salaRef, { placar: [0, 0] });
                tempoSegundos = 600;
                atuCronometroUI();
                if(interval) { clearInterval(interval); interval = null; }
            } catch (error) {
                alert("Erro ao finalizar: " + error.message);
            }
        };

        window.carregarRanking = async () => {
            const lista = document.getElementById("listaRanking");
            lista.innerHTML = "Carregando...";
            try {
                const q = query(collection(db, "usuarios"), orderBy("gols", "desc"), limit(10));
                const snap = await getDocs(q);
                lista.innerHTML = "";
                if (snap.empty) {
                    lista.innerHTML = "Nenhum golo registado ainda.";
                    return;
                }
                let i = 1;
                snap.forEach((doc) => {
                    const d = doc.data();
                    lista.innerHTML += `<div class="ranking-item"><span>${i}º</span><b>${doc.id}</b><span style="color:var(--neon)">${d.gols || 0} G</span></div>`;
                    i++;
                });
            } catch (e) {
                lista.innerHTML = "Erro ao carregar ranking.";
            }
        };

        window.toggleCronometro = () => {
            if (interval) { clearInterval(interval); interval = null; } 
            else { interval = setInterval(() => { tempoSegundos--; atuCronometroUI(); }, 1000); }
        };

        function atuCronometroUI() {
            let m = Math.floor(Math.abs(tempoSegundos)/60).toString().padStart(2,'0');
            let s = (Math.abs(tempoSegundos)%60).toString().padStart(2,'0');
            document.getElementById("cronometro").innerText = (tempoSegundos < 0 ? "-" : "") + `${m}:${s}`;
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById("telaLogin").style.display = "none";
                document.getElementById("conteudo").style.display = "block";
                document.getElementById("userName").innerText = user.displayName;
                const salaRef = await obterReferenciaSala();
                if (salaRef) {
                    onSnapshot(salaRef, (s) => {
                        if(s.exists()){
                            const d = s.data().placar;
                            document.getElementById("pA").innerText = d[0] || 0;
                            document.getElementById("pB").innerText = d[1] || 0;
                        }
                    });
                }
            } else {
                document.getElementById("telaLogin").style.display = "block";
                document.getElementById("conteudo").style.display = "none";
            }
        });

        window.mudarAba = (aba) => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.getElementById("abaJogo").style.display = aba === 'jogo' ? 'block' : 'none';
            document.getElementById("abaRank").style.display = aba === 'rank' ? 'block' : 'none';
            if (aba === 'rank') carregarRanking();
        };
    </script>
</head>
<body>
    <div id="telaLogin" class="card" style="text-align:center; margin-top:80px; display:none;">
        <h1 style="color:var(--neon)">ARENA FUT PRO</h1>
        <button class="btn-neon" onclick="login()">🔐 ENTRAR COM GOOGLE</button>
    </div>

    <div id="conteudo" style="display:none">
        <div class="user-info">
            <span>Olá, <b id="userName">...</b></span>
            <button class="btn-logout" onclick="logout()">SAIR</button>
        </div>

        <div class="tab-container">
            <div class="tab active" onclick="mudarAba('jogo')">JOGO</div>
            <div class="tab" onclick="mudarAba('rank')">RANKING</div>
        </div>

        <div id="abaJogo">
            <div class="card">
                <div id="cronometro">10:00</div>
                <button style="background:#333; color:#fff; width:100%; padding:10px; margin:10px 0; border-radius:8px;" onclick="toggleCronometro()">INICIAR / PAUSAR</button>
                <div class="placar-box"><span id="pA" style="color:var(--blue)">0</span><span>X</span><span id="pB" style="color:var(--red)">0</span></div>
                <button class="btn-neon" onclick="registrarGol(0, 'Alemão')">⚽ GOL AZUL</button>
                <button class="btn-neon" style="background:var(--red)" onclick="registrarGol(1, 'Linaldo')">⚽ GOL RED</button>
                
                <button class="btn-finish" onclick="finalizarPartida()">🏁 FINALIZAR PARTIDA (ZERAR)</button>
            </div>
        </div>

        <div id="abaRank" style="display:none">
            <div class="card">
                <h3 style="color:var(--gold)">🏆 TOP ARTILHEIROS</h3>
                <div id="listaRanking">Sincronizando...</div>
            </div>
        </div>
    </div>
</body>
</html>

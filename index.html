<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena Fut PRO - Elite Edition</title>
    <style>
        :root { --neon: #00ff88; --dark: #000; --card: #1a1a1a; --border: #333; --blue: #007bff; --red: #dc3545; --gold: #ffcc00; }
        body { background: var(--dark); color: #fff; font-family: 'Segoe UI', sans-serif; padding: 10px; margin: 0; padding-bottom: 80px; min-height: 100vh; }
        button { border-radius: 12px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .btn-neon { background: var(--neon); color: #000; padding: 15px; width: 100%; margin-top: 10px; }
        .card { background: var(--card); padding: 15px; border-radius: 16px; margin-bottom: 12px; border: 1px solid var(--border); }
        .placar-box { font-size: 55px; font-weight: 900; text-align: center; display: flex; justify-content: center; align-items: center; gap: 20px; }
        .tab-container { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; }
        .tab { flex: 1; min-width: 80px; padding: 10px; text-align: center; background: #222; border-radius: 8px; font-size: 10px; cursor: pointer; color: #888; }
        .tab.active { background: var(--neon); color: #000; font-weight: bold; }
        #cronometro { font-size: 40px; text-align: center; color: var(--gold); font-weight: 900; }
        .user-info { display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-bottom: 10px; color: #aaa; }
        .btn-logout { background: transparent; color: #ff4444; border: 1px solid #ff4444; padding: 5px 10px; font-size: 10px; border-radius: 5px; }
        .ranking-item { display: grid; grid-template-columns: 30px 1fr 60px; padding: 12px; border-bottom: 1px solid #222; font-size: 14px; align-items: center; }
        .player-row { display: flex; justify-content: space-between; padding: 10px; background: #222; margin-bottom: 5px; border-radius: 8px; font-size: 13px; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, updateDoc, getDoc, setDoc, increment, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyDy0lRzcm_9TPYFHz1bJUMwIW9NupkXjG0", 
            authDomain: "arena-fut-42a7d.firebaseapp.com", 
            projectId: "arena-fut-42a7d" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let SALA_ID = "aLNOO6Ds6fEBmrj6P7he"; 
        let tempoSegundos = 600;
        let interval = null;

        window.login = () => signInWithPopup(auth, provider);
        window.logout = () => signOut(auth).then(() => location.reload());

        async function obterRef() {
            let ref = doc(db, "salas", SALA_ID);
            let snap = await getDoc(ref);
            if (!snap.exists()) {
                const q = await getDocs(collection(db, "salas"));
                if (!q.empty) { SALA_ID = q.docs[0].id; ref = doc(db, "salas", SALA_ID); }
            }
            return ref;
        }

        window.registrarGol = async (idx, nome) => {
            const ref = await obterRef();
            const snap = await getDoc(ref);
            let placar = snap.data().placar || [0,0];
            placar[idx]++;
            await updateDoc(ref, { placar });
            const uRef = doc(db, "usuarios", nome);
            await setDoc(uRef, { gols: increment(1) }, { merge: true });
        };

        window.sortearTimes = async () => {
            const snap = await getDocs(collection(db, "usuarios"));
            let jogadores = [];
            snap.forEach(d => jogadores.push(d.id));
            jogadores.sort(() => Math.random() - 0.5);
            
            let azul = [], vermelho = [];
            jogadores.forEach((j, i) => { (i % 2 === 0) ? azul.push(j) : vermelho.push(j); });
            
            const ref = await obterRef();
            await updateDoc(ref, { timeAzul: azul, timeVermelho: vermelho, placar: [0,0] });
            alert("Times Sorteados!");
            window.mudarAba('jogo');
        };

        window.finalizar = async () => {
            if(!confirm("Encerrar partida?")) return;
            const ref = await obterRef();
            const snap = await getDoc(ref);
            const p = snap.data().placar;
            alert(`Fim! Azul ${p[0]} x ${p[1]} Vermelho`);
            await updateDoc(ref, { placar: [0,0] });
            tempoSegundos = 600;
            atuCronometroUI();
        };

        window.mudarAba = (aba) => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.currentTarget?.classList.add('active');
            ['abaJogo', 'abaRank', 'abaJogadores'].forEach(id => document.getElementById(id).style.display = 'none');
            document.getElementById('aba' + aba.charAt(0).toUpperCase() + aba.slice(1)).style.display = 'block';
            if(aba === 'rank') carregarRanking();
            if(aba === 'jogadores') carregarJogadores();
        };

        async function carregarRanking() {
            const q = query(collection(db, "usuarios"), orderBy("gols", "desc"), limit(10));
            const snap = await getDocs(q);
            const lista = document.getElementById("listaRanking");
            lista.innerHTML = "";
            snap.forEach((d, i) => {
                lista.innerHTML += `<div class="ranking-item"><span>${i+1}º</span><b>${d.id}</b><span style="color:var(--neon)">${d.data().gols || 0} G</span></div>`;
            });
        }

        async function carregarJogadores() {
            const snap = await getDocs(collection(db, "usuarios"));
            const lista = document.getElementById("listaJogadores");
            lista.innerHTML = "";
            snap.forEach(d => {
                lista.innerHTML += `<div class="player-row"><span>${d.id}</span><span style="color:var(--neon)">Presente</span></div>`;
            });
        }

        window.toggleCronometro = () => {
            if (interval) { clearInterval(interval); interval = null; } 
            else { interval = setInterval(() => { tempoSegundos--; atuCronometroUI(); }, 1000); }
        };

        function atuCronometroUI() {
            let m = Math.floor(Math.abs(tempoSegundos)/60).toString().padStart(2,'0');
            let s = (Math.abs(tempoSegundos)%60).toString().padStart(2,'0');
            document.getElementById("cronometro").innerText = (tempoSegundos < 0 ? "-" : "") + `${m}:${s}`;
        }

        onAuthStateChanged(auth, async (u) => {
            if (u) {
                document.getElementById("telaLogin").style.display = "none";
                document.getElementById("conteudo").style.display = "block";
                document.getElementById("userName").innerText = u.displayName;
                const ref = await obterRef();
                onSnapshot(ref, (s) => {
                    if(s.exists()){
                        document.getElementById("pA").innerText = s.data().placar[0];
                        document.getElementById("pB").innerText = s.data().placar[1];
                    }
                });
            } else {
                document.getElementById("telaLogin").style.display = "block";
                document.getElementById("conteudo").style.display = "none";
            }
        });
    </script>
</head>
<body>
    <div id="telaLogin" style="text-align:center; margin-top:100px; display:none;">
        <h1 style="color:var(--neon)">ARENA FUT PRO</h1>
        <button class="btn-neon" onclick="login()">ENTRAR COM GOOGLE</button>
    </div>

    <div id="conteudo" style="display:none">
        <div class="user-info">
            <span>Jogador: <b id="userName">...</b></span>
            <button class="btn-logout" onclick="logout()">SAIR</button>
        </div>

        <div class="tab-container">
            <div class="tab active" onclick="mudarAba('jogo')">JOGO</div>
            <div class="tab" onclick="mudarAba('jogadores')">JOGADORES</div>
            <div class="tab" onclick="mudarAba('rank')">RANKING</div>
        </div>

        <div id="abaJogo">
            <div class="card">
                <div id="cronometro">10:00</div>
                <button style="background:#333; color:#fff; width:100%; padding:10px; margin:10px 0; border-radius:8px;" onclick="toggleCronometro()">PLAY / PAUSE</button>
                <div class="placar-box"><span id="pA" style="color:var(--blue)">0</span><span>X</span><span id="pB" style="color:var(--red)">0</span></div>
                <button class="btn-neon" onclick="registrarGol(0, 'Alemão')">GOL AZUL</button>
                <button class="btn-neon" style="background:var(--red)" onclick="registrarGol(1, 'Linaldo')">GOL RED</button>
                <button style="background:transparent; color:var(--gold); border:1px solid var(--gold); width:100%; padding:10px; margin-top:15px;" onclick="finalizar()">FINALIZAR PARTIDA</button>
            </div>
        </div>

        <div id="abaJogadores" style="display:none">
            <div class="card">
                <h3>LISTA DE PRESENÇA</h3>
                <div id="listaJogadores">Carregando...</div>
                <button class="btn-neon" onclick="sortearTimes()">SORTEAR TIMES INTELIGENTES</button>
            </div>
        </div>

        <div id="abaRank" style="display:none">
            <div class="card">
                <h3>TOP ARTILHEIROS</h3>
                <div id="listaRanking">Sincronizando...</div>
            </div>
        </div>
    </div>
</body>
</html>

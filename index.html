<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARENA FUT PRO</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
</head>
<body style="background:#121212; color:white; font-family:sans-serif; text-align:center; padding-top:50px;">

    <h1>ARENA FUT PRO</h1>
    <div style="background:#1e1e1e; padding:30px; border-radius:15px; display:inline-block; border-bottom:4px solid #d4ff00;">
        <button id="btn-login" style="padding:15px 30px; background:#d4ff00; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">
            Entrar com Google
        </button>
        <p id="status" style="color:red; font-size:12px; margin-top:10px;"></p>
    </div>

    <script>
        // Usei a sua apiKey corrigida das fotos
        const config = {
            apiKey: "AIzaSyDyB1Rzcm_9TPYFHzlbJUMWIN9NupkXjG0",
            authDomain: "arena-fut-42a7d.firebaseapp.com",
            projectId: "arena-fut-42a7d",
            storageBucket: "arena-fut-42a7d.appspot.com",
            messagingSenderId: "843798970197",
            appId: "1:843798970197:web:222e052ef828065e5f39dc"
        };

        // Inicializa
        firebase.initializeApp(config);

        document.getElementById('btn-login').onclick = function() {
            const provider = new firebase.auth.GoogleAuthProvider();
            firebase.auth().signInWithPopup(provider)
                .then(result => {
                    alert("Bem-vindo, " + result.user.displayName);
                    document.getElementById('status').style.color = "#d4ff00";
                    document.getElementById('status').innerText = "Logado com sucesso!";
                })
                .catch(error => {
                    console.error(error);
                    document.getElementById('status').innerText = "Erro: " + error.message;
                });
        };
    </script>
</body>
</html>

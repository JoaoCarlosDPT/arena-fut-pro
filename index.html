<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARENA FUT PRO</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <style>
        :root { --primary: #d4ff00; --bg: #121212; --card: #1e1e1e; --text: #ffffff; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: var(--card); padding: 30px; border-radius: 15px; border-left: 5px solid var(--primary); text-align: center; width: 90%; max-width: 400px; }
        button { width: 100%; padding: 15px; background: var(--primary); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        #msg-erro { color: #ff4444; margin-top: 15px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div id="tela-login">
        <h1 style="color:var(--primary);">ARENA FUT PRO</h1>
        <div class="card">
            <button onclick="loginGoogle()">Entrar com Google</button>
            <div id="msg-erro"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDyB1Rzcm_9TPYFHzlbJUMWIN9NupkXjG0",
            authDomain: "arena-fut-42a7d.firebaseapp.com",
            databaseURL: "https://arena-fut-42a7d-default-rtdb.firebaseio.com",
            projectId: "arena-fut-42a7d",
            storageBucket: "arena-fut-42a7d.firebasestorage.app",
            messagingSenderId: "843798970197",
            appId: "1:843798970197:web:222e052ef828065e5f39dc"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        function loginGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then(() => { alert("Sucesso! O Arena Fut PRO está online."); })
                .catch(err => { document.getElementById('msg-erro').innerText = "Erro: " + err.message; });
        }
    </script>
</body>
</html>
